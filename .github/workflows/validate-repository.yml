name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
      - preprod

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository contracts
        run: python3 scripts/validate_repository.py
      - name: Pinned refresh helper contract tests
        run: python3 -m unittest discover -s tests -p 'test_refresh_existing_package.py' -v
